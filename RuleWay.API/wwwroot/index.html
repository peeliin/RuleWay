<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RuleWay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">
        <div class="container">
            <div class="topbar-content">

                <div>
                    <h1 class="brand-title">RuleWay</h1>
                    <p class="brand-subtitle">Product Management</p>
                </div>

                
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">

            <div id="alertContainer"></div>

            <div class="page-heading">

                <div>
                    <h2>Products</h2>
                    <p>Manage your products and stock information.</p>
                </div>

                <button id="addProductBtn" class="add-product-btn">
                    + Add Product
                </button>

            </div>

            <div class="filter-card">

                <div class="filter-group">
                    <label for="keywordInput">Keyword</label>
                    <input id="keywordInput"
                           type="text"
                           placeholder="Search products...">
                </div>

                <div class="filter-group">
                    <label for="minStockInput">Min Stock</label>
                    <input id="minStockInput"
                           type="number"
                           placeholder="0">
                </div>

                <div class="filter-group">
                    <label for="maxStockInput">Max Stock</label>
                    <input id="maxStockInput"
                           type="number"
                           placeholder="100">
                </div>

                <button id="filterBtn" class="filter-btn">
                    Filter
                </button>

                <button id="clearBtn" class="clear-btn">
                    Clear
                </button>

            </div>

            <div class="product-card">

                <div class="table-responsive">
                    <table class="product-table">

                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="productTableBody">
                        </tbody>

                    </table>
                </div>

                <div class="pagination-area">

                    <button id="previousBtn" class="pagination-btn">
                        Previous
                    </button>

                    <span id="pageInfo">
                        Page 1
                    </span>

                    <button id="nextBtn" class="pagination-btn">
                        Next
                    </button>

                </div>

            </div>

        </div>
    </main>

    <div class="modal fade"
         id="productModal"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content product-modal">

                <div class="modal-header">
                    <h5 id="modalTitle" class="modal-title">
                        Add Product
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <form id="productForm">

                    <div class="modal-body">

                        <input type="hidden" id="productId">

                        <div class="form-item">
                            <label for="productTitle">Title</label>
                            <input id="productTitle"
                                   type="text"
                                   required>
                        </div>

                        <div class="form-item">
                            <label for="productDescription">
                                Description
                            </label>

                            <textarea id="productDescription"
                                      rows="3"></textarea>
                        </div>

                        <div class="form-item">
                            <label for="productStock">
                                Stock Quantity
                            </label>

                            <input id="productStock"
                                   type="number"
                                   min="0"
                                   required>
                        </div>

                        <div class="form-item">
                            <label for="productCategory">
                                Category
                            </label>

                            <select id="productCategory">
                                <option value="">
                                    No Category
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="cancel-btn"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit"
                                class="save-btn">
                            Save Product
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
